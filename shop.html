<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Custom font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- First navbar -->
    <nav class="navbar d-none- d-md-block bg-first-custom" data-bs-theme="dark">
        <div class="container">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a href="#" class="nav-link active" aria-current="page">Sign up and get 20% OFF for your order</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Second navbar -->
    <nav class="navbar navbar-expand-lg sticky-top" id="navbar-color">
        <div class="container-fluid">
            <a href="./index.html" class="navbar-brand-fw-bold fs-3 linkColor">
                <img src="./media/logo1.png" alt="logo" class="logo" id="logo_navbar">
            </a>
            <button class="navbar-toggler shadow-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <div class="widthCustom">

                </div>
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a href="./index.html" class="nav-link linkColor" aria-current="page">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="./shop.html" class="nav-link active linkColor">Shop</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                </form>
                <i class="bi bi-cart-fill mx-3 linkColor text-accent-custom"></i>
                <i class="bi bi-person linkColor text-accent-custom"></i>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="container-fluid my-3">
        <section class="row">
            <article class="col-12 text-center">
                <h1>Our Services</h1>
            </article>
        </section>
    </header>

    <!-- Shop Section -->
    <main class="container-fluid">
        <section class="row">
            <div class="col-12 col-md-3">

                <h3>Filter by:</h3>

                <div class="accordion accordion-flush" id="accordionFlushExample">
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="headingOne">
                            <button class="accordion-button collapsed bg-dark text-white shadow-none" type="button"
                                data-bs-toggle="collapse" data-bs-target="#flush-collapseOne" aria-expanded="true"
                                aria-controls="flush-collapseOne">
                                <h4>Category</h4>
                            </button>
                        </h2>
                        <div id="flush-collapseOne" class="accordion-collapse collapse" aria-labelledby="headingOne"
                            data-bs-parent="#accordionFlushExample">
                            <div class="accordion-body" id="radioWrapper">
                                <div class="form-check">
                                    <input type="radio" class="form-check-input" name="categories" id="All" checked>
                                    <label for="All" class="form-check-label">All categories</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="headingTwo">
                            <button class="accordion-button collapsed bg-dark text-white shadow-none" type="button"
                                data-bs-toggle="collapse" data-bs-target="#flush-collapseTwo" aria-expanded="false"
                                aria-controls="flush-collapseTwo">
                                <h4>Price</h4>
                            </button>
                        </h2>
                        <div id="flush-collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo"
                            data-bs-parent="#accordionFlushExample">
                            <div class="accordion-body">
                                <input type="range" class="w-100" max="100" id="priceInput">
                                <p id="priceRange">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="headingThree">
                            <button class="accordion-button collapsed bg-dark text-white shadow-none" type="button"
                                data-bs-toggle="collapse" data-bs-target="#flush-collapseThree" aria-expanded="false"
                                aria-controls="flush-collapseThree">
                                <h4>Search</h4>
                            </button>
                        </h2>
                        <div id="flush-collapseThree" class="accordion-collapse collapse" aria-labelledby="headingThree"
                            data-bs-parent="#accordionFlushExample">
                            <div class="accordion-body">
                                <input type="text" class="form-control" placeholder="Search..." value=""
                                    id="searchInput">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-9 d-flex flex-wrap justify-content-evenly" id="cardWrapper">

            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="shop.js"></script>
</body>

</html>
