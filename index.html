<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Custom font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- First navbar -->
    <nav class="navbar d-none- d-md-block bg-first-custom" data-bs-theme="dark">
        <div class="container">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a href="#" class="nav-link active" aria-current="page">Sign up and get 20% OFF for your order</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Second navbar -->
    <nav class="navbar navbar-expand-lg sticky-top" id="navbar-color">
        <div class="container">
            <a href="#" class="navbar-brand-fw-bold fs-3 linkColor">
                <img src="./media/logo1.png" alt="" class="logo" id="logo_navbar">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="Toggle navigation">
                <i class="fa-solid fa-bars linkColor"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <div class="widthCustom">

                </div>
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a href="./index.html" class="nav-link active linkColor" aria-current="page">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="./annunci.html" class="nav-link linkColor">Shop</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                </form>
                <i class="bi bi-cart-fill mx-3 linkColor text-accent-custom"></i>
                <i class="bi bi-person linkColor text-accent-custom"></i>
            </div>
        </div>
    </nav>

    <header class="container margin-top-custom bg-hero position-relative">
        <div class="row h-100 justify-content-center align-items-center">
            <!-- <h1 class="display-4 fw-bold text-white">Level up your style</h1> -->
            <button class="button-6 bg-accent-custom" role="button">Shop now <i
                    class="bi bi-arrow-right ms-3"></i></button>
        </div>
    </header>

    <section class="container margin-top-custom bg-first-custom numbers-section mb-5">
        <div class="row h-100 text-white align-items-center text-center">
            <article class="col-12 col-md-4">
                <p class="fs-3"><span class="fw-bold fs-2 text-accent-custom" id="numberOne">0</span> Customers</p>
            </article>
            <article class="col-12 col-md-4">
                <p class="fs-3"><span class="fw-bold fs-2 text-accent-custom" id="numberTwo">0</span> Sold producs</p>
            </article>
            <article class="col-12 col-md-4">
                <p class="fs-3"><span class="fw-bold fs-2 text-accent-custom" id="numberThree">0</span> Positive reviews
                </p>
            </article>
        </div>
    </section>
    <!-- Reviews -->
    <section class="container-fluid">
        <div class="row justify-content-center bg-first-custom py-5">
            <article class="col-12 col-md-8">
                <h3 class="text-center text-white">Reviews</h3>
                <div id="myCarousel" class="carousel slide">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <div class="reviewCard">
                                <p class="lead fw-bold">Donald</p>
                                <p class="p-3">Best option on the market</p>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="carousel-control-prev bg-dark" data-bs-target="#myCarousel"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previus</span>
                    </button>
                    <button type="button" class="carousel-control-next bg-dark" data-bs-target="#myCarousel"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </article>
        </div>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>

</html>
